# Final Stage 2 test evaluation (not run yet; user, 2026-10-20).
# The test omissions are size-balanced: roughly a third each of small / medium / large (Stage 1 size bins,
# % of the building: < 2.7 / < 7.7 / larger; configs/stage1/corruption.yaml). Generator: src/stage2/detect/omission_mix.py
# (plan_bins + omit_balanced). Small = the image_eval kinds; medium / large = room (whole) and region
# (src/stage2/data/erasure_large.py) with their size ranges cut to the bin.
size_mix:
  small: 0.3333
  medium: 0.3333
  large: 0.3334
fallback: true          # a drawing where no kind fits its target bin takes the next bin in turn; report realised counts
# Case counts of src/stage2/final_test.py (the notebook kaggle/notebooks/stage2_final_test)
seed: 2026
n_fill_per_bin: 40      # FILL ablation (hole given): 40 small + 40 medium + 40 large windows of completion_test
n_detect_intact: 60     # CHECK: intact test drawings (false alarms)
n_detect_omitted: 120   # CHECK: test drawings with one size-balanced omission
n_e2e: 120              # whole pipeline: further test drawings with one size-balanced omission (60 -> 120, 2026-10-22)
