# Stage 2 PARSE, v1: plain segmentation (CE + Dice), no constraint losses.
# python -m src.stage2.parse.train --config configs/stage2/parser_v1.yaml --data <parser dir> --out <run dir>

model:
  arch: Unet                 # segmentation_models_pytorch
  encoder: resnet34
  encoder_weights: imagenet  # standard transfer learning (user decision 2026-10-17)
  in_channels: 1             # greyscale drawing
  classes: 16

data:
  crop: 512
  rare_centre_prob: 0.5      # share of crops centred on a pixel of a rare class
  min_foreground: 0.05       # reject crops with < 5% non-background pixels (user, 2026-10-17) ...
  max_tries: 10              # ... re-drawing at most 10 times
  rare_classes: [door, window, railing, toilet, sink, bath_shower, appliance]
  pad_image: 255             # white paper outside the drawing
  ignore_index: 255

augment:
  scale: [0.6, 1.6]          # drawing scale (walls ~8 px -> 4.8..12.8 px)
  rot90: true
  flip: true
  binarise: {p: 0.3, offset: [-30, 30]}           # Otsu threshold +- offset
  line_width: {p: 0.3, px: [1, 2]}                # thicken or thin dark lines
  blur: {p: 0.3, sigma: [0.4, 1.5]}
  noise: {p: 0.3, std: [3, 15]}
  jpeg: {p: 0.3, quality: [30, 95]}
  contrast: {p: 0.5, alpha: [0.7, 1.3], beta: [-30, 30]}

loss:
  ce_weight_cap: 10          # CE class weights = sqrt(f_max / f_c), capped
  dice: 1.0                  # Dice over the classes present in the batch, added to CE

train:
  batch_size: 8              # per GPU
  workers: 2                 # per GPU process (Kaggle: 4 CPUs for 2 GPUs)
  lr: 3.0e-4                 # decoder + head
  lr_encoder: 1.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 500
  grad_clip: 1.0
  amp: true
  time_limit_hours: 2.75     # whole session, incl. data copy and validation
  checkpoint_minutes: 30
  val_minutes: 20
  log_every: 50
  seed: 0

val:
  pad_multiple: 32
  component_classes: [door, window, toilet, sink, bath_shower, appliance]
  component_iou: 0.5
  fallback: {wall_iou: 0.5, opening_f1: 0.3}   # CubiCasa model fallback trigger (door AND window F1)

smoke:                       # --smoke: CPU, tiny, exercises checkpoint + resume
  crop: 128
  batch_size: 2
  workers: 0
  encoder_weights: null
  max_steps: 6
  val_plans: 2
  checkpoint_steps: 3
  val_steps: 3
