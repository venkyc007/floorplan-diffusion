# Stage 2 PARSE, v2: parser v1 fine-tuned with text erasure + local constraint losses (user, 2026-10-19).
# python -m src.stage2.parse.train_v2 --config configs/stage2/parser_v2.yaml --variant A|B ...
# Same model / data / augmentation as v1 (configs/stage2/parser_v1.yaml); changed: lr, warm-up, time, the v2 block.

model:
  arch: Unet
  encoder: resnet34
  encoder_weights: imagenet  # unused: weights come from the parser v1 checkpoint
  in_channels: 1
  classes: 16

data:
  crop: 512
  rare_centre_prob: 0.5
  min_foreground: 0.05
  max_tries: 10
  rare_classes: [door, window, railing, toilet, sink, bath_shower, appliance]
  pad_image: 255
  ignore_index: 255

augment:
  scale: [0.6, 1.6]
  rot90: true
  flip: true
  binarise: {p: 0.3, offset: [-30, 30]}
  line_width: {p: 0.3, px: [1, 2]}
  blur: {p: 0.3, sigma: [0.4, 1.5]}
  noise: {p: 0.3, std: [3, 15]}
  jpeg: {p: 0.3, quality: [30, 95]}
  contrast: {p: 0.5, alpha: [0.7, 1.3], beta: [-30, 30]}

loss:
  ce_weight_cap: 10
  dice: 1.0

train:
  batch_size: 8              # one variant per GPU (no DDP)
  workers: 2                 # per variant (Kaggle: 4 CPUs for 2 processes)
  lr: 1.0e-4                 # decoder + head (fine-tune: 1/3 of v1)
  lr_encoder: 3.0e-5
  weight_decay: 1.0e-2
  warmup_steps: 200
  grad_clip: 1.0
  amp: true
  time_limit_hours: 1.85     # training per variant; the kernel (~2.5 h) also does setup + the final evaluation
  checkpoint_minutes: 30
  val_minutes: 25
  log_every: 50
  seed: 0

val:
  component_classes: [door, window, toilet, sink, bath_shower, appliance]
  component_iou: 0.5

v2:
  calib_batches: 20          # gradient-size calibration of the constraint weights
  val_plans: 60              # tuning val drawings for checkpoint selection (whole drawings, normal + text erased)
