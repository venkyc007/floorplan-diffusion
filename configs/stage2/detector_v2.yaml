# Stage 2 CHECK: detector v2 (src/stage2/detect/train_detector_v2.py), warm-started from detector v1 (K2a).
# Same model / inputs / outputs / loss as configs/stage2/detector.yaml; trained on parser v2B maps (user, 2026-10-19).

data:
  window: 128
  parsed_share: 0.7          # 70% parsed drawings with image-level omissions, 30% old label-level simulation
  intact_p: 0.2              # label-level part, as v1
  n_omit: [1, 3]

loss:
  ce_weight_cap: 10
  dice: 1.0

train:
  batch_size: 32
  workers: 4                 # one run per kernel: all 4 CPUs
  lr: 1.0e-4                 # fine-tune (v1: 3e-4)
  weight_decay: 1.0e-2
  warmup_steps: 100
  grad_clip: 1.0
  seed: 0
  log_every: 50
  checkpoint_minutes: 30
  val_minutes: 15
  time_limit_hours: 2.0      # user

val:
  windows: 512               # fixed windows of the parsed TUNING drawings
