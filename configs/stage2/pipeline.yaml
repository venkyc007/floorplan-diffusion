# Stage 2 end-to-end pipeline (src/stage2/pipeline/run.py): PARSE -> CHECK -> FILL -> VERIFY.
# Checkpoints are local copies of Kaggle outputs (git-ignored).

checkpoints:
  parser: outputs/kaggle/parser_v2/runs/parser_v2B/checkpoints/best.pt   # v2B mixed (user, 2026-10-19); v1 was parser_v1/runs/parser_v1
  detector: outputs/kaggle/detv2/runs/detector_v2/checkpoints/best.pt   # v2 (user, 2026-10-19); v1 was k2a/runs/k2a_detector
  detector_v3: outputs/kaggle/detv3/runs/detector_v3/checkpoints/best.pt   # drawing + parse (user, 2026-10-19)
  unet: outputs/kaggle/k2a/runs/k2a_unet/checkpoints/best.pt
  diffusion: outputs/kaggle/k1/runs/k1_constrained/checkpoints/best.pt
  diffusion_control: outputs/kaggle/k1/runs/k1_control/checkpoints/best.pt   # K1 control (ablation, final test)
  stage1_unet: outputs/runs/unet_matched/checkpoints/best.pt    # frozen Stage 1 (configs/app.yaml): large-hole B2
  stage1_diffusion: outputs/kaggle/finetune_constraints/runs/finetune_constraints/checkpoints/best.pt
  b4_unet: outputs/kaggle/b4/runs/b4_unet/checkpoints/best.pt            # B4: 256 px large-hole fine-tune (2026-10-21)
  b4_diffusion: outputs/kaggle/b4/runs/b4_diffusion/checkpoints/best.pt

parse:
  scales: [0.5, 0.7, 1.0, 1.4, 2.0]   # tried on the input drawing; keep the one with walls closest to 8 px
  wall_px: 8
  max_side: 2048
  completion_wall_px: 3                # label map rescaled so walls = 3 px

detect:
  settings: configs/stage2/detector_threshold.yaml   # threshold, min blob, final rule set

fill:
  window: 128
  n_samples: 4                         # best-of-N for the demo (8 for evaluation)
  eta_guidance: 0                      # off (user, 2026-10-20): tuning (outputs/stage2/eta_tune.md) chose 0.1, but
                                       # 0.1-3 change nothing measurable and are 2.4x slower
  ddim_steps: 50
  size_bins: [0.027, 0.077]            # hole area / building area: small / medium / large (Stage 1 bins)
  t0: [400, 600, 700]                  # per size bin (Stage 1 size-adaptive hybrid)
  t0_fixed: 300                        # overrides the bins: chosen by the t0 diagnostic (outputs/stage2/t0_sweep.md)
  sketch_prior: true                   # type-guided fill: missing component painted into the U-Net sketch (user, 2026-10-19)
  max_hole: 100                        # holes larger than this (px, either side) are cut to it, except region-missing
                                       # flags and large manual boxes: those go to the large-hole fill
  large_strategy: big                  # big / coarse / tiled (src/stage2/complete/large_fill.py): B1 with the B4 models
                                       # (validated in outputs/stage2/b4_val.md, large_fill_compare_v2.md; 2026-10-21)
  t0_refine: 150                       # coarse: t0 of the 16-class refinement of the Stage 1 layout
  large_models: b4                     # current / b4: large holes -> B4 (val: +7 tol. mIoU); small holes stay on the current models
  seed: 0

fast:                                  # live-app settings on the CPU (evaluation numbers use `fill`)
  n_samples: 2
  steps_from_t0: 15                    # DDIM steps from t0 down to 0
  guide_last: 5                        # guidance only on the last 5 steps
