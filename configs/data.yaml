# Settings for the data pipeline (src/data/).
# Change numbers here instead of inside the code.

paths:
  raw_dir: data/raw                                 # where the downloaded dataset lives
  pickle: data/raw/resplan_unzipped/ResPlan.pkl     # the ResPlan file after unzipping
  resplan_split: data/raw/resplan/split.json        # ResPlan's own split (tells which plans are augmented copies)
  processed_dir: data/processed                     # where our converted arrays go
  samples_png: outputs/samples.png                  # preview grid of converted plans

raster:
  size: 128      # output image is size x size pixels
  padding: 4     # empty border (pixels) on every side; the plan fills the rest

dedup:
  # Plans are compared using small (grid x grid) versions of their images.
  grid: 32
  # Thresholds were chosen by looking at example pairs at each similarity level:
  #   >= 0.90  the same plan re-posted / rotated / tiny edits
  #   0.85-0.90  same design with small variations (a moved door, an extra wall)
  #   0.80-0.85  different apartments that merely share a common shape
  # Two plans whose small images match at least this well (0..1, see dedup.py)
  # are near-duplicates -> all but one are REMOVED.
  remove_threshold: 0.90
  # A looser threshold: plans this similar are not removed, but they are kept
  # in the SAME split, so even "fairly similar" plans can't leak across splits.
  # (0.80 is too loose: chains of generic plans merge into one 200+ group.)
  group_threshold: 0.85

split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42       # fixed random seed so the split is the same every time
