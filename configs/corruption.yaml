# Settings for removing parts of floor plans (src/data/corruptions.py),
# the training dataset (src/data/dataset.py) and the fixed benchmarks
# (src/data/make_benchmark.py). Reasons for each choice: docs/decisions.md.

mask:
  padding: [2, 6]          # mask = component bounding box + random 2..6 px per side

wall:
  run_length: 6            # a wall pixel is "horizontal" if it lies on a horizontal run of >= 6 wall pixels (same for vertical)
  segment_length: [8, 40]  # keep straight wall segments whose length is in this range (px)

room:
  min_area: 20             # ignore room components smaller than this (px): slivers, not rooms
  max_box_pct: 50          # skip room components whose bounding box covers > 50% of the building (open-plan chains)

region:
  side: [8, 64]            # random rectangle: width and height each drawn from this range (px)

position:
  # distance of the mask centre from the building centre, divided by the
  # building "radius" (largest distance from the centre to a building pixel)
  edge_cutoff: 0.55        # < cutoff -> "center", >= cutoff -> "edge" (= median over 1,500 train plans x 5 types)

size_bins:
  # mask area as % of the building area (wall+door+window+room pixels).
  # Edges = tertiles of single-corruption masks (1,500 train plans x 5 types,
  # pooled): 2.69% and 7.71%, rounded.
  edges: [2.7, 7.7]        # small < 2.7% <= medium < 7.7% <= large

train:
  type_probs: {door: 0.2, window: 0.2, wall: 0.2, room: 0.2, region: 0.2}
  multi_prob: 0.2          # share of samples with several components removed at once
  multi_count: [2, 3]      # how many components in a multi-removal

benchmark:
  seed: 2026
  types: [door, window, wall, room, region]
